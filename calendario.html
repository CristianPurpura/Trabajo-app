<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <link rel="stylesheet" href="calendario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="page calendario-page">
        <header class="header">
            <div class="heart-logo">❤️</div>
            <div class="app-name">App Salud</div>
        </header>

        <div class="content">
            <div class="calendar-container">
                <h2 class="calendar-title">Agenda</h2>
                <div class="calendar-controls">
                    <button>&lt;</button>
                    <span>junio 2024</span>
                    <button>&gt;</button>
                </div>
                <div class="weekdays">
                    <span>lu</span>
                    <span>ma</span>
                    <span>mi</span>
                    <span>ju</span>
                    <span>vi</span>
                    <span>sá</span>
                    <span>do</span>
                </div>
                <div class="days-grid">
                    <span></span><span></span><span></span><span></span><span>1</span><span>2</span><span>3</span>
                    <span>4</span><span>5</span><span class="selected">6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                    <span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
                    <span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span>
                </div>
            </div>

            </div>

        <footer class="bottom-nav">
            <button class="nav-item" onclick="navigateTo('index.html')">
                <div class="nav-icon-container">
                    <i class="fas fa-home"></i>
                </div>
            </button>
            <button class="nav-item active" onclick="navigateTo('calendario.html')">
                <div class="nav-icon-container">
                    <i class="fas fa-calendar-alt"></i>
                </div>
            </button>
            <button class="nav-item" onclick="navigateTo('hidratacion.html')">
                <div class="nav-icon-container">
                    <i class="fas fa-tint"></i>
                </div>
            </button>
            <button class="nav-item" onclick="navigateTo('recetas.html')">
                <div class="nav-icon-container">
                    <i class="fas fa-utensils"></i>
                </div>
            </button>
        </footer>
    </div>
    <script>
        function navigateTo(page) {
            console.log(`Navegando a: ${page}`);
            window.location.href = page;
        }
    </script>
</body>
</html>
