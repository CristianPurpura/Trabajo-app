<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear una cuenta</title>
    <link rel="stylesheet" href="crear-cuenta.css">
</head>
<body>
    <div class="page crear-cuenta-page">
        <header class="header">
            <div class="heart-logo">❤️</div>
            <div class="app-name">App Salud</div>
        </header>

        <div class="content">
            <h2 class="signup-title">Crear una cuenta</h2>
            <form class="signup-form">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="additional-info">Información adicional</label>
                    <textarea id="additional-info" name="additional-info" placeholder="Información adicional (opcional)"></textarea>
                </div>
                <button type="submit" class="signup-button">Registrarse</button>
            </form>
            <p class="login-link">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </div>
    </div>
</body>
</html>
